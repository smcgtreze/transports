syntax = "proto3";

package transports;

import "common.proto";

option java_package = "com.example.transports";
option java_multiple_files = true;

service AlertsService {
  rpc GetAlerts(AlertsRequest) returns (AlertsResponse);
}

message AlertsRequest {
  optional string route_id = 1;
  optional string operator_id = 2;
  string region_name = 3;
  string countryIso = 4;
  Key key = 5;
  optional string lang = 6;
}

message AlertsResponse {
  string region_name = 1;
  repeated Alert alerts = 2;
  double processing_time_ms = 3;
}
