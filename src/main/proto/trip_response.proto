syntax = "proto3";

package transports;

import "common.proto";

option java_package = "com.example.transports";
option java_multiple_files = true;

service TripService {
  rpc GetTrip(TripRequest) returns (TripResponse);
}

message TripRequest {
  string trip_id = 1;
  Key key = 2;
  string region_name = 3;
  optional string lang = 4;
}

message TripResponse {
  string url_route_short_name = 1;
  string agency_url = 2;
  string route_color = 3;
  string route_short_name = 4;
  repeated TripStop stops = 5;
  double processing_time_ms = 6;
  string trip_id = 7;
  string route_id = 8;
  string country_iso = 9;
  string route_long_name = 10;
  string agency_name = 11;
  string agency_phone = 12;
  string region_name = 13;
  string agency_id = 14;
  string trip_headsign = 15;
  optional int32 wheelchair_accessible = 16;
  string country_url = 17;
  string polyline = 18;
  string route_desc = 19;
  string route_type = 20;
  string url_agency_name = 21;
  string route_text_color = 22;
}

message TripStop {
  double stop_lon = 1;
  optional string stop_desc = 2;
  optional int32 wheelchair_boarding = 3;
  string country_url = 4;
  string url_stop_name = 5;
  optional int32 drop_off_type = 6;
  string country_iso = 7;
  string departure_time = 8;
  string stop_id = 9;
  double stop_lat = 10;
  string arrival_time = 11;
  string stop_name = 12;
}
